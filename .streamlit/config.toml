[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#34d399"
backgroundColor = "#0b0c0e"
secondaryBackgroundColor = "#16181c"
textColor = "#f5f6f8"
borderColor = "#262930"
linkColor = "#34d399"
font = "'DM Sans', sans-serif"
headingFont = "'DM Sans', sans-serif"
codeFont = "'JetBrains Mono', monospace"
baseRadius = "0.7rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
dataframeBorderColor = "#262930"
dataframeHeaderBackgroundColor = "#111317"

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/dm-sans-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/dm-sans-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/dm-sans-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/jetbrains-mono-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/jetbrains-mono-latin-700-normal.woff2"
weight = 700
style = "normal"
